name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Node 22 + Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowi
          POSTGRES_PASSWORD: flowi
          POSTGRES_DB: flowi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowi -d flowi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://flowi:flowi@localhost:5432/flowi_test
      SUPERVISOR_PIN: "1234"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
