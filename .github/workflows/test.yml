name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Node 22 + MariaDB 10.5
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://flowi:flowi@127.0.0.1:3317/flowi_test
      SUPERVISOR_PIN: "1234"
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer MariaDB (même config qu'en local)
        run: docker compose -f docker-compose.test.yml up -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
