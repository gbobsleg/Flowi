services:
  mariadb-test:
    image: docker.io/library/mariadb:10.5.29
    container_name: flowi-mariadb-test
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: flowi_test
      MARIADB_USER: flowi
      MARIADB_PASSWORD: flowi
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3317:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
